<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Primary protection and conditional backup</title><desc id="desc">Simplified functional diagram: primary protection clears the fault; backup acts if clearing fails, according to coordination.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#37647b"/></marker></defs><rect width="960" height="600" fill="white"/><text x="480" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#17334c">Primary protection and conditional backup</text><line x1="75" y1="85" x2="885" y2="85" stroke="#9eabb3" stroke-width="3"/><rect x="350" y="110" width="260" height="75" rx="12" fill="#edf4f7" stroke="#37647b" stroke-width="2"/><text x="480.0" y="155.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c">Grid fault</text><line x1="480" y1="185" x2="480" y2="220" stroke="#37647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="225" width="340" height="75" rx="12" fill="#edf4f7" stroke="#37647b" stroke-width="2"/><text x="480.0" y="270.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c">Primary protection / trip</text><line x1="480" y1="300" x2="480" y2="328" stroke="#37647b" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 330 L650 385 L480 440 L310 385 Z" fill="#edf4f7" stroke="#37647b" stroke-width="2"/><text x="480" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#17334c">Fault cleared?</text><text x="480" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#17334c">(simplified logic)</text><line x1="310" y1="385" x2="167" y2="385" stroke="#37647b" stroke-width="3" marker-end="url(#arrow)"/><text x="245" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c">Yes</text><rect x="20" y="350" width="145" height="75" rx="12" fill="#edf4f7" stroke="#37647b" stroke-width="2"/><text x="92.5" y="395.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c">Done</text><line x1="650" y1="385" x2="720" y2="385" stroke="#37647b" stroke-width="3" marker-end="url(#arrow)"/><text x="685" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c">No</text><rect x="725" y="333" width="215" height="105" rx="12" fill="#fff0e7" stroke="#37647b" stroke-width="2"/><text x="832.5" y="379.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c">Coordinated</text><text x="832.5" y="407.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c">backup</text><text x="480" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c">Functional principle; not a relay wiring diagram.</text><text x="480" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c">No settings or protection timing values.</text></svg>