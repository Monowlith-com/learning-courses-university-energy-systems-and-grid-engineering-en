<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Bus injections in a three-bus network</title><desc id="desc">A injects 10 MW; B and C withdraw 6 and 4 MW. Three undirected branches; flows not determined.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#37647b"/></marker></defs><rect width="960" height="600" fill="white"/><text x="480" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#17334c">Bus injections in a three-bus network</text><line x1="75" y1="85" x2="885" y2="85" stroke="#9eabb3" stroke-width="3"/><line x1="480" y1="220" x2="230" y2="385" stroke="#37647b" stroke-width="3"/><line x1="480" y1="220" x2="730" y2="385" stroke="#37647b" stroke-width="3"/><line x1="230" y1="385" x2="730" y2="385" stroke="#37647b" stroke-width="3"/><circle cx="480" cy="220" r="49" fill="#edf4f7" stroke="#37647b" stroke-width="3"/><text x="480" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#17334c">A</text><text x="480" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17334c">+10 MW</text><circle cx="230" cy="385" r="49" fill="#edf4f7" stroke="#37647b" stroke-width="3"/><text x="230" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#17334c">B</text><text x="230" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17334c">−6 MW</text><circle cx="730" cy="385" r="49" fill="#edf4f7" stroke="#37647b" stroke-width="3"/><text x="730" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#17334c">C</text><text x="730" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#17334c">−4 MW</text><text x="480" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#17334c">Lossless teaching model</text><text x="480" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#17334c">Σ P = +10 − 6 − 4 = 0 MW</text><text x="480" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c">Power balance does not determine individual branch flows.</text></svg>