<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Energy conversion and net efficiency</title>
<desc id="desc">Thermal input is converted to gross electrical generator output; subtracting auxiliary demand and internal losses gives net grid export. Worked example: 100 MW thermal input, 40 MW gross and 38 MW net.</desc>
<rect width="960" height="600" fill="#ffffff"/>
<text x="480" y="65" text-anchor="middle" fill="#16354a" font-family="Arial, sans-serif" font-size="30">Energy conversion and net efficiency</text>
<line x1="75" y1="90" x2="885" y2="90" stroke="#9eabb3" stroke-width="2"/>
<rect x="45" y="235" rx="14" width="180" height="135" fill="#edf4f7" stroke="#37647b" stroke-width="2.5"/>
<text x="135" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#17334c">Primary input</text>
<path d="M225 300 L276 300" stroke="#37647b" stroke-width="4"/>
<path d="M264 292 L276 300 L264 308" fill="none" stroke="#37647b" stroke-width="4"/>
<rect x="277" y="235" rx="14" width="180" height="135" fill="#edf4f7" stroke="#37647b" stroke-width="2.5"/>
<text x="367" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#17334c">Turbine</text>
<path d="M457 300 L508 300" stroke="#37647b" stroke-width="4"/>
<path d="M496 292 L508 300 L496 308" fill="none" stroke="#37647b" stroke-width="4"/>
<rect x="509" y="235" rx="14" width="180" height="135" fill="#edf4f7" stroke="#37647b" stroke-width="2.5"/>
<text x="599" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#17334c">Generator</text>
<path d="M689 300 L740 300" stroke="#37647b" stroke-width="4"/>
<path d="M728 292 L740 300 L728 308" fill="none" stroke="#37647b" stroke-width="4"/>
<rect x="741" y="235" rx="14" width="180" height="135" fill="#edf4f7" stroke="#37647b" stroke-width="2.5"/>
<text x="831" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#17334c">Grid export</text>
<line x1="100" y1="445" x2="860" y2="445" stroke="#c0cbd0" stroke-width="1.5"/>
<text x="480" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#244c5f">Pnet = Pgross,el − Paux</text>
<text x="480" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#244c5f">Example: 100 MW thermal → 40 MW gross − 2 MW auxiliary = 38 MW net</text>
</svg>
