<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Load curve in four time windows</title>
<desc id="desc">0–15 min; 15–30 min; 30–45 min; 45–60 min</desc>
<rect width="960" height="600" fill="#ffffff"/>
<text x="480" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" fill="#172c43">Load curve in four time windows</text>
<line x1="85" y1="85" x2="875" y2="85" stroke="#9eabb3" stroke-width="2" stroke-linecap="round"/>
<line x1="130" y1="480" x2="840" y2="480" stroke="#2f596a" stroke-width="4" stroke-linecap="round"/>
<line x1="130" y1="480" x2="130" y2="150" stroke="#2f596a" stroke-width="4" stroke-linecap="round"/>
<text x="55" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172c43">kW</text>
<text x="840" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172c43">min</text>
<rect x="190" y="348" width="118" height="132" rx="13" fill="#e8f1f5" stroke="#2f596a" stroke-width="2"/>
<text x="249" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172c43">4 kW</text>
<text x="249" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172c43">0–15 min</text>
<rect x="355" y="216" width="118" height="264" rx="13" fill="#e8f1f5" stroke="#2f596a" stroke-width="2"/>
<text x="414" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172c43">8 kW</text>
<text x="414" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172c43">15–30 min</text>
<rect x="520" y="282" width="118" height="198" rx="13" fill="#e8f1f5" stroke="#2f596a" stroke-width="2"/>
<text x="579" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172c43">6 kW</text>
<text x="579" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172c43">30–45 min</text>
<rect x="685" y="414" width="118" height="66" rx="13" fill="#e8f1f5" stroke="#2f596a" stroke-width="2"/>
<text x="744" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172c43">2 kW</text>
<text x="744" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#172c43">45–60 min</text>
<text x="480" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172c43">E = 5 kWh; peak = 8 kW</text>
</svg>
