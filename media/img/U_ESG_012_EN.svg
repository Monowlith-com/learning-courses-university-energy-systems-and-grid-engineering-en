<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">AC power flow: coupled bus variables</title>
<desc id="desc">Real and reactive power jointly depend on bus voltage magnitude and angle; the network equations and limits are checked together.</desc>
<rect width="960" height="600" fill="#ffffff"/>
<text x="480" y="62" text-anchor="middle" fill="#16354a" font-family="Arial, sans-serif" font-size="30">AC power flow: coupled bus variables</text>
<line x1="80" y1="89" x2="880" y2="89" stroke="#9eabb3" stroke-width="2"/>
<rect x="62" y="195" width="238" height="94" rx="14" fill="#edf4f7" stroke="#37647b" stroke-width="2.5"/>
<text x="181" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#17334c">Real power P</text>
<rect x="62" y="313" width="238" height="94" rx="14" fill="#edf4f7" stroke="#37647b" stroke-width="2.5"/>
<text x="181" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#17334c">Reactive power Q</text>
<rect x="368" y="208" width="242" height="184" rx="20" fill="#e0edf2" stroke="#1c5f78" stroke-width="3.5"/>
<text x="489" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#17334c">Network bus i</text>
<text x="489" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#17334c">Magnitude |V| + angle θ</text>
<path d="M300 242 L368 268 M300 360 L368 332" stroke="#37647b" stroke-width="4" fill="none"/>
<rect x="676" y="190" width="226" height="95" rx="14" fill="#edf4f7" stroke="#37647b" stroke-width="2.5"/>
<text x="789" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#17334c">Coupling via Y matrix</text>
<rect x="676" y="312" width="226" height="95" rx="14" fill="#edf4f7" stroke="#37647b" stroke-width="2.5"/>
<text x="789" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#17334c">Balance + limit checks</text>
<path d="M610 265 L676 240 M610 332 L676 358" stroke="#37647b" stroke-width="4" fill="none"/>
<line x1="100" y1="455" x2="860" y2="455" stroke="#c0cbd0" stroke-width="1.5"/>
<text x="480" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#244c5f">Pᵢ + jQᵢ = Vᵢ · Iᵢ*</text>
</svg>
